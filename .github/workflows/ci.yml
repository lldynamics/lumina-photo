name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.16.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm --prefix server ci && npm --prefix web ci

      - name: Typecheck server & web
        run: npm run typecheck

      - name: Run server & web tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  windows-metadata:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Verify Windows streams and HTTPS
        working-directory: server
        run: node --import tsx --test tests/windows_metadata.test.ts tests/https.test.ts
